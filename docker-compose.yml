# Postgres local para desarrollo. En producción se usa Supabase (capa gratuita).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
